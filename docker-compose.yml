services:
  photoframe:
    build:
      context: https://github.com/corey-schneider/immich-photoframe-endpoint.git
    container_name: immich-photoframe
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      IMMICH_URL:           "${IMMICH_URL}"
      IMMICH_API_KEY:       "${IMMICH_API_KEY}"
      HORIZONTAL_ALBUM_ID:  "${HORIZONTAL_ALBUM_ID}"
      VERTICAL_ALBUM_ID:    "${VERTICAL_ALBUM_ID}"

      # ── Optional (uncomment to override defaults)
      # PORT:               8765
      # DATE_FORMAT:        "%b %-d, %y"
      # OVERLAY_OPACITY:    40
      # TEXT_OPACITY:       180
      # FONT_SIZE_DIVISOR:  30
      # MARGIN_DIVISOR:     70
